name: Feature request
description: Propose a capability or integration change.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 现在缺什么，影响谁。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 属于哪个仓库、哪个契约、是否需要新作用域/租约。
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 影响层
      options:
        - 治理 / CI
        - 契约
        - 系统 / 安全 / 控制权
        - 能力模块
        - 应用
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全
      options:
        - label: 该需求不会新增绕过统一运动入口的路径。
          required: true
        - label: 如涉及实机，已说明需要单独授权。
          required: true
