<text x="86" y="203" font-size="9" fill="#58A6FF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">DECLARATION</text>
<text x="86" y="226" font-size="16" fill="#F2F5F8" font-weight="700" text-anchor="start" opacity="1.0">Facts, not execution</text>
<text x="86" y="246" font-size="10.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">jcheng-devices  ·  jcheng-scenarios</text>
<text x="86" y="282.0" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">Own device and scenario facts. Offline validation only; no</text>
<text x="86" y="294.09" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">DDS, node, device or motion.</text>
<rect x="570" y="180" width="300" height="110" rx="11" fill="#111820" stroke="#263341" stroke-width="1" opacity="1.0"/>
<rect x="570" y="180" width="3" height="110" rx="1.5" fill="#5B9BFF" opacity="1.0"/>
<text x="586" y="203" font-size="9" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">L1 CONTRACT</text>
<text x="586" y="226" font-size="16" fill="#F2F5F8" font-weight="700" text-anchor="start" opacity="1.0">Cross-repo formats</text>
<text x="586" y="246" font-size="10.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">jcheng-interfaces  v0.2.0</text>
<text x="586" y="262.0" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">Owns IDL, schemas and hashes. No node, device or</text>
<text x="586" y="274.09" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">runtime logic.</text>
<rect x="70" y="380" width="380" height="140" rx="11" fill="#111820" stroke="#263341" stroke-width="1" opacity="1.0"/>
<rect x="70" y="380" width="3" height="140" rx="1.5" fill="#5B9BFF" opacity="1.0"/>
<text x="86" y="403" font-size="9" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">L4 / L3 INTENT</text>
<text x="86" y="426" font-size="16" fill="#F2F5F8" font-weight="700" text-anchor="start" opacity="1.0">Propose, never execute</text>
<text x="86" y="446" font-size="10.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">applications  ·  studio  ·  teleop  ·  mobile</text>
<text x="86" y="492.0" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">Submit intent over HTTP/WS or a declared topic. No device</text>
<text x="86" y="504.09" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">access; no second actuator path.</text>
<rect x="70" y="560" width="380" height="110" rx="11" fill="#111820" stroke="#263341" stroke-width="1" opacity="1.0"/>
<rect x="70" y="560" width="3" height="110" rx="1.5" fill="#D29922" opacity="1.0"/>
<text x="86" y="583" font-size="9" fill="#D29922" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">L3 ADVISORY</text>
<text x="86" y="606" font-size="16" fill="#F2F5F8" font-weight="700" text-anchor="start" opacity="1.0">Observe and propose</text>
<text x="86" y="626" font-size="10.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">jcheng-perception</text>
<text x="86" y="642.0" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">Produces scene observations and advisory poses. No motion</text>
<text x="86" y="654.09" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">command, no fabricated depth or TF.</text>
<rect x="570" y="350" width="300" height="170" rx="11" fill="#13233D" stroke="#5B9BFF" stroke-width="1.8" opacity="1.0"/>
<text x="586" y="374" font-size="9" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">L2 AUTHORITY</text>
<text x="586" y="398" font-size="17" fill="#F2F5F8" font-weight="750" text-anchor="start" opacity="1.0">jcheng-system</text>
<text x="586" y="416" font-size="9.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">0.3.0-dev0  ·  sole execution point</text>
<text x="586" y="438" font-size="10" fill="#F2F5F8" font-weight="400" text-anchor="start" class="mono" opacity="1.0">lease  ·  safety veto  ·  arbiter</text>
<text x="586" y="454" font-size="10" fill="#F2F5F8" font-weight="400" text-anchor="start" class="mono" opacity="1.0">executor  ·  hardware bridge  ·  evidence</text>
<text x="586" y="476.0" font-size="9" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">No runtime dependency on L3 or L4. ArmPi</text>
<text x="586" y="487.7" font-size="9" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">scopes verified; PiPER read-only in</text>
<text x="586" y="499.4" font-size="9" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">progress.</text>
<rect x="570" y="560" width="300" height="110" rx="11" fill="#111820" stroke="#263341" stroke-width="1" opacity="1.0"/>
<rect x="570" y="560" width="3" height="110" rx="1.5" fill="#6C7A89" opacity="1.0"/>
<text x="586" y="583" font-size="9" fill="#6C7A89" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">OPS</text>
<text x="586" y="606" font-size="16" fill="#F2F5F8" font-weight="700" text-anchor="start" opacity="1.0">Observe and restart</text>
<text x="586" y="626" font-size="10.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">jcheng-ops  v0.1.0</text>
<text x="586" y="642.0" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">HTTP health only. No DDS, device, lease or</text>
<text x="586" y="654.09" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">motion. ArmPi probes are legacy.</text>
<rect x="70" y="690" width="800" height="120" rx="11" fill="#111820" stroke="#263341" stroke-width="1" stroke-dasharray="5 4" opacity="1.0"/>
<rect x="70" y="690" width="3" height="120" rx="1.5" fill="#5B9BFF" opacity="1.0"/>
<text x="86" y="713" font-size="9" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">OFFLINE / MEASUREMENT</text>
<text x="86" y="736" font-size="16" fill="#F2F5F8" font-weight="700" text-anchor="start" opacity="1.0">No runtime edge</text>
<text x="86" y="756" font-size="10.5" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">learning  ·  simulation (domain 43)  ·  benchmark  ·  research</text>
<text x="86" y="782.0" font-size="9.3" fill="#6C7A89" font-weight="400" text-anchor="start" opacity="1.0">Datasets, plants, suites and reports. None is imported by the runtime or sends motion.</text>
<text x="1080" y="172" font-size="10.5" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.6" opacity="1.0">HARDWARE PLANE</text>
<rect x="1080" y="180" width="450" height="300" rx="11" fill="#111820" stroke="#263341" stroke-width="1" opacity="1.0"/>
<rect x="1098" y="198" width="414" height="80" rx="7" fill="#0B0F14" stroke="#263341" stroke-width="1" opacity="1.0"/>
<text x="1112" y="222" font-size="14" fill="#F2F5F8" font-weight="650" text-anchor="start" opacity="1.0">ArmPi Ultra</text>
<text x="1112" y="240" font-size="9" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">5-DoF · Pi 5</text>
<rect x="1112" y="248" width="47" height="18" rx="9.0" fill="#111820" opacity="1.0"/>
<text x="1120" y="260.06" font-size="8.5" fill="#58A6FF" font-weight="600" text-anchor="start" class="mono" letter-spacing="0.4" opacity="1.0">FROZEN</text>
<text x="1498" y="226" font-size="8.5" fill="#6C7A89" font-weight="400" text-anchor="end" opacity="1.0">Verified scopes; revocation pending</text>
<rect x="1098" y="290" width="414" height="80" rx="7" fill="#0B0F14" stroke="#263341" stroke-width="1" opacity="1.0"/>
<text x="1112" y="314" font-size="14" fill="#F2F5F8" font-weight="650" text-anchor="start" opacity="1.0">PiPER X</text>
<text x="1112" y="332" font-size="9" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">6-DoF · CAN · fixed cell</text>
<rect x="1112" y="340" width="79" height="18" rx="9.0" fill="#111820" opacity="1.0"/>
<text x="1120" y="352.06" font-size="8.5" fill="#5B9BFF" font-weight="600" text-anchor="start" class="mono" letter-spacing="0.4" opacity="1.0">P2 READ-ONLY</text>
<text x="1498" y="318" font-size="8.5" fill="#6C7A89" font-weight="400" text-anchor="end" opacity="1.0">Leader read-only; follower not commanded</text>
<rect x="1098" y="382" width="414" height="80" rx="7" fill="#0B0F14" stroke="#263341" stroke-width="1" opacity="1.0"/>
<text x="1112" y="406" font-size="14" fill="#F2F5F8" font-weight="650" text-anchor="start" opacity="1.0">AR5</text>
<text x="1112" y="424" font-size="9" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">7-DoF · EtherCAT · dual-arm</text>
<rect x="1112" y="432" width="52" height="18" rx="9.0" fill="#111820" opacity="1.0"/>
<text x="1120" y="444.06" font-size="8.5" fill="#6C7A89" font-weight="600" text-anchor="start" class="mono" letter-spacing="0.4" opacity="1.0">PLANNED</text>
<text x="1498" y="410" font-size="8.5" fill="#6C7A89" font-weight="400" text-anchor="end" opacity="1.0">Identity gate: six facts required</text>
<marker id="arr-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA8B6"/></marker>
<path d="M 450 235 L 570 235" fill="none" stroke="#9AA8B6" stroke-width="1.5" stroke-dasharray="5 4" opacity="1.0" marker-end="url(#arr-m)"/>
<text x="460" y="226" font-size="9" fill="#6C7A89" font-weight="400" text-anchor="start" class="mono" opacity="1.0">pin / proposal</text>
