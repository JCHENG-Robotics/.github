<text x="1278" y="503.24" font-size="9" fill="#1F5FE0" font-weight="600" text-anchor="start" class="mono" letter-spacing="0.4" opacity="1.0">P2 READ-ONLY</text>
<rect x="1382" y="490" width="71" height="20" rx="10.0" fill="#FFFFFF" opacity="1.0"/>
<text x="1390" y="503.24" font-size="9" fill="#8B97A6" font-weight="600" text-anchor="start" class="mono" letter-spacing="0.4" opacity="1.0">P3 PLANNED</text>
<text x="820" y="530" font-size="9.6" fill="#5A6675" font-weight="400" text-anchor="start" class="mono" opacity="1.0">P2  two candleLight CAN channels · leader read-only · follower not commanded</text>
<text x="820" y="548" font-size="9.6" fill="#5A6675" font-weight="400" text-anchor="start" class="mono" opacity="1.0">P3  teach capture → offline replay → supervised JOINT_TRAJECTORY execution</text>
<text x="820" y="566" font-size="9.6" fill="#5A6675" font-weight="400" text-anchor="start" class="mono" opacity="1.0">Every frame confirmed on CAN; stop aborts the in-flight frame.</text>
<text x="820" y="586" font-size="8.8" fill="#8B97A6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">No PiPER motion authority exists today. ArmPi results do not transfer.</text>
<rect x="64" y="628" width="1472" height="84" rx="10" fill="#FDE8E6" stroke="#B42318" stroke-width="1.2" stroke-dasharray="5 4" opacity="1.0"/>
<text x="84" y="654" font-size="10.5" fill="#B42318" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.6" opacity="1.0">NO SECOND PATH</text>
<text x="84" y="678" font-size="10.2" fill="#0F1720" font-weight="400" text-anchor="start" opacity="1.0">MoveIt plans; the arbiter executes  ·  the leader arm is read-only  ·  Studio proxies stop and never dispatches</text>
<text x="84" y="696" font-size="10.2" fill="#0F1720" font-weight="400" text-anchor="start" opacity="1.0">Capabilities do not publish vendor topics  ·  declarations never override the safety envelope  ·  CI never triggers motion</text>
