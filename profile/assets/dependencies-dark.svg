<text x="730" y="324" font-size="9" fill="#6C7A89" font-weight="400" text-anchor="start" class="mono" opacity="1.0">contract</text>
<line x1="450" y1="430" x2="570" y2="430" stroke="#5B9BFF" stroke-width="1.8" opacity="1.0" marker-end="url(#arr-a2)"/>
<text x="458" y="421" font-size="9" fill="#6C7A89" font-weight="400" text-anchor="start" class="mono" opacity="1.0">HTTP/WS intent</text>
<path d="M 450 620 L 510 620 L 510 480 L 570 480" fill="none" stroke="#9AA8B6" stroke-width="1.5" stroke-dasharray="5 4" opacity="1.0" marker-end="url(#arr-m)"/>
<text x="458" y="612" font-size="9" fill="#6C7A89" font-weight="400" text-anchor="start" class="mono" opacity="1.0">advisory pose</text>
<line x1="720" y1="560" x2="720" y2="520" stroke="#9AA8B6" stroke-width="1.5" stroke-dasharray="5 4" opacity="1.0" marker-end="url(#arr-m)"/>
<text x="730" y="544" font-size="9" fill="#6C7A89" font-weight="400" text-anchor="start" class="mono" opacity="1.0">HTTP health</text>
<line x1="870" y1="430" x2="1080" y2="430" stroke="#5B9BFF" stroke-width="2.2" opacity="1.0" marker-end="url(#arr-a2)"/>
<text x="880" y="421" font-size="9.5" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" opacity="1.0">ExecuteMotion  ·  only publisher</text>
<rect x="1080" y="520" width="450" height="300" rx="11" fill="#2D1517" stroke="#F85149" stroke-width="1.2" stroke-dasharray="5 4" opacity="1.0"/>
<text x="1098" y="548" font-size="10" fill="#F85149" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.4" opacity="1.0">FORBIDDEN EDGES</text>
<text x="1098" y="572" font-size="10" fill="#F2F5F8" font-weight="400" text-anchor="start" opacity="1.0">A bypass is a release blocker, not a preference.</text>
<text x="1098" y="602" font-size="11" fill="#F85149" font-weight="700" text-anchor="start" opacity="1.0">✕</text>
<text x="1118" y="602" font-size="9.8" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">capability / application → hardware</text>
<text x="1098" y="628" font-size="11" fill="#F85149" font-weight="700" text-anchor="start" opacity="1.0">✕</text>
<text x="1118" y="628" font-size="9.8" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">studio → DDS, device or lease</text>
<text x="1098" y="654" font-size="11" fill="#F85149" font-weight="700" text-anchor="start" opacity="1.0">✕</text>
<text x="1118" y="654" font-size="9.8" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">devices / scenarios → system runtime</text>
<text x="1098" y="680" font-size="11" fill="#F85149" font-weight="700" text-anchor="start" opacity="1.0">✕</text>
<text x="1118" y="680" font-size="9.8" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">learning → device or motion</text>
<text x="1098" y="706" font-size="11" fill="#F85149" font-weight="700" text-anchor="start" opacity="1.0">✕</text>
<text x="1118" y="706" font-size="9.8" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">any second hardware publisher</text>
<text x="1098" y="732" font-size="11" fill="#F85149" font-weight="700" text-anchor="start" opacity="1.0">✕</text>
<text x="1118" y="732" font-size="9.8" fill="#9AA8B6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">CI or unattended script → real motion</text>
<rect x="700" y="700" width="95" height="18" rx="9.0" fill="#0B0F14" stroke="#6C7A89" stroke-width="1" opacity="1.0"/>
<text x="708" y="712.06" font-size="8.5" fill="#6C7A89" font-weight="600" text-anchor="start" class="mono" letter-spacing="0.4" opacity="1.0">NO RUNTIME EDGE</text>
<line x1="48" y1="858" x2="1552" y2="858" stroke="#263341" stroke-width="1" opacity="1.0"/>
<text x="48" y="876" font-size="10" fill="#6C7A89" font-weight="400" text-anchor="start" class="mono" opacity="1.0">Source: docs/repo-boundaries.md v1.0 · docs/repo-taxonomy.md · ADR-0002 (single motion entry) · ADR-0007 (fixed cell).</text>
<text x="1552" y="876" font-size="10" fill="#6C7A89" font-weight="400" text-anchor="end" class="mono" opacity="1.0">JCHENG ROBOTICS  /  DEPENDENCIES</text>
