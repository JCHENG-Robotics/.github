<text x="64" y="54" font-size="10.5" fill="#5B9BFF" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.8" opacity="1.0">DEPENDENCY MAP  /  RESPONSIBILITY</text>
<text x="64" y="94" font-size="30" fill="#F2F5F8" font-weight="720" text-anchor="start" opacity="1.0">What may depend on what</text>
<text x="64" y="122" font-size="13.5" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">One declaration source per fact, one execution point per action, one contract location per format.</text>
<line x1="64" y1="148" x2="96" y2="148" stroke="#5B9BFF" stroke-width="2.2" opacity="1.0"/>
<text x="104" y="152" font-size="10" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">runtime dependency</text>
<line x1="248" y1="148" x2="280" y2="148" stroke="#9AA8B6" stroke-width="1.6" stroke-dasharray="5 4" opacity="1.0"/>
<text x="288" y="152" font-size="10" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">declaration / read-only</text>
<line x1="470" y1="148" x2="502" y2="148" stroke="#F85149" stroke-width="1.6" stroke-dasharray="4 4" opacity="1.0"/>
<text x="510" y="152" font-size="10" fill="#9AA8B6" font-weight="400" text-anchor="start" opacity="1.0">forbidden / no path</text>
<rect x="70" y="180" width="380" height="130" rx="11" fill="#111820" stroke="#263341" stroke-width="1" stroke-dasharray="5 4" opacity="1.0"/>
