# Boundary-check waivers. A waiver records a known residual; it does not
# eliminate the finding. Critical safety rules are not waived silently: the
# reason, owner and expiry are reviewed by the Board.
schema_version: 1
waivers:
  - id: W-2026-11-27-01
    rule: B4
    repo: jcheng-studio
    evidence: backend/app/legacy_motion.py
    reason: >-
      Legacy motion is default-disabled (HTTP 410 unless ARMPI_MODE=legacy and
      ARMPI_ENABLE_LEGACY_MOTION=1). The code is isolated in
      backend/app/legacy_motion.py and is not on the default backend path.
      Removal is scheduled; the waiver expires 2026-12-31.
    owner: jcheng-studio
    expires: "2026-12-31"
    reviewed_by: Board
    reviewed_at: "2026-11-27"
    removal_plan: >-
      Split the non-motion `legacy_motion_error` helper out of the module so the
      default backend does not import the legacy adapter; then, no later than
      2026-12-31 or the legacy gateway retirement, move the adapter to
      tools/legacy or delete it. No new features and no new callers. The
      default-disabled 410 path stays covered by tests until removal.
    closure_criteria: >-
      The B4 finding is eliminated (no /motion/dispatch in the repository),
      legacy endpoints remain permanently 410, the default/dual-switch/stop
      tests still pass, and this waiver entry is removed.
