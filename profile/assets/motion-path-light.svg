<text x="84" y="566" font-size="9.6" fill="#5A6675" font-weight="400" text-anchor="start" class="mono" opacity="1.0">M6  S13 21/21 · S17 real MoveIt plan-only · 8-point plan</text>
<text x="84" y="586" font-size="8.8" fill="#8B97A6" font-weight="400" text-anchor="start" class="mono" opacity="1.0">Revocation of motion authority is pending operator action; read-only demo retained.</text>
