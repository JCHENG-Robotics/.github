<text x="64" y="54" font-size="10.5" fill="#1F5FE0" font-weight="700" text-anchor="start" class="mono" letter-spacing="1.8" opacity="1.0">AUTHORITY  /  ONE PATH</text>
<text x="64" y="94" font-size="30" fill="#0F1720" font-weight="720" text-anchor="start" opacity="1.0">Every motion passes the same boundary</text>
<text x="64" y="122" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" opacity="1.0">The system layer is the only execution point. Everything else proposes, observes or declares.</text>
